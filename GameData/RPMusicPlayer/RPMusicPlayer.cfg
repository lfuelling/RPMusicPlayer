// RPMusicPlayer configuration
//
// Paths may be absolute, or relative to the KSP install directory.
// The same file works on Windows, macOS and Linux; use forward slashes.

RPMUSICPLAYER
{
    // Where your music lives. Create it and drop files (or sub folders) in.
    // Default: GameData/RPMusicPlayer/Music
    // MUSICPATH = GameData/RPMusicPlayer/Music

    // Music volume, 0 to 1, applied on top of KSP's master volume.
    VOLUME = 0.7

    // Files bigger than this many megabytes are streamed from disk instead of being
    // decoded into memory. A long wave file can decode to several hundred megabytes, and
    // streaming keeps the memory used to a small buffer whatever the library size.
    //
    // The trade off is that a streamed track cannot be resumed from its position, so it
    // restarts from the beginning. Use 0 to never stream, or -1 to always stream.
    // STREAMABOVE = 24

    // Scan sub folders of the music folder as well.
    SCANSUBFOLDERS = true

    // Look through the music folder when the game starts.
    // Turn this off to add music only from the browser's rescan entry.
    SCANONSTART = true

    // Music keeps playing when you step out of the cockpit to look at your ship.
    // Turn this on to pause whenever the player leaves the cockpit instead.
    //
    // Kerbal Space Program 1.12 gives mods no way to tell "the kerbals are outside"
    // apart from "the player switched to the chase camera", so this option pauses for
    // both. Leave it off if you would rather the music followed you around.
    // PAUSEWHENOUTSIDEIVA = false

    // Lower case file extensions that count as playable.
    // Wave is the only format the game's audio engine is verified to decode. Others
    // can be listed here, but a format the engine refuses loads as an empty clip,
    // which shows up as a track that stops instead of playing.
    // EXTENSIONS = wav

    // Which button opens the music player.
    //
    // The music pages join the page cycle of one of the monitor's own buttons, the
    // same way the built in RPM modes do, so pressing that button cycles through the
    // pod's screens and into the music player.
    //
    // Name the RasterPropMonitor page whose button you want, and the music player
    // becomes an extra mode on that button. The plugin logs which button drives which
    // page when it patches a monitor, so you can pick from that list. For the stock
    // RasterPropMonitor MFD it is:
    //
    //   page                          button    label on the panel
    //   home, test, description        button_STBY
    //   map                            buttonR1
    //   orbit, orbitgraphical          buttonR2   orb
    //   targetcam                      buttonR3   dock
    //   shipinfo                       buttonR4   data
    //   crewinfo, flightlog            buttonR5   crew
    //   resources                      buttonR6   rsrc
    //   navball, aviapfd               button_A   nav
    //   graphs                         button_B
    //   targetmenu                     button_C
    //   sas, smartass                  button_D
    //
    // A partial name works too, so "res" matches "resources". Below it is set to
    // shipinfo, the button labelled DATA on the stock MFD.
    ENTRYPAGE = shipinfo

    // Lower level alternative, used when ENTRYPAGE is empty. Name the button directly,
    // or use one of:
    //
    //   auto    add the music player as a second mode on a button that currently
    //           drives a single screen
    //   screen  use the monitor screen itself
    //   none    do not add an entry point
    //
    // ENTRYBUTTON = auto
}